#String de conexión a la base de datos
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/pa2_u2
#Tipo de base de datos
quarkus.datasource.db-kind=postgresql
#Usuario de la base de datos
quarkus.datasource.username=postgres
#Contraseña de la base de datos
quarkus.datasource.password=labcom,2015
#Mostrar las sentencias SQL en la consola: Esto es útil para depuración y desarrollo, pero no se recomienda en producción
quarkus.hibernate-orm.log.sql=true
#Gestion de la base de datos: Drop and create: borra y crea la base de datos cada vez que se inicia la aplicación
#quarkus.hibernate-orm.database.generation=drop-and-create
#Gestion de la base de datos: Update: actualiza la base de datos cada vez que se inicia la aplicación, sincronizando los cambios en las entidades con la base de datos
quarkus.hibernate-orm.database.generation=update
 